name: Installer mirror

# The setup skill runs a readable copy of https://tryhamster.com/cli/install,
# and the copy's header pins the SHA-256 of the hosted script it mirrors. This
# checks that pin once a day. On drift it opens one issue, or comments on the
# one already open, naming the file to update; when the pin matches again it
# closes that issue. It runs on a schedule rather than on pushes, so a website
# deploy never fails a pull request or holds up a plugin version tag.
on:
  schedule:
    - cron: "17 9 * * *"
  # Rerun the check by hand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: Compare the hosted installer with the bundled copy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      COPY: skills/setup/scripts/install-hamster-cli.sh
      HOSTED: https://tryhamster.com/cli/install
      TITLE: Bundled CLI installer is out of date with tryhamster.com/cli/install
    steps:
      - uses: actions/checkout@v4
      - name: Compare hashes and open, update, or close the issue
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^# hosted-installer-sha256: \([0-9a-f]\{64\}\)$/\1/p' "$COPY")"
          if [ -z "$pinned" ]; then
            echo "$COPY has no hosted-installer-sha256 pin." >&2
            exit 1
          fi
          live="$(curl -fsSL "$HOSTED" | sha256sum | cut -d' ' -f1)"

          # Match the title exactly; search alone also returns partial matches.
          open_issue="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "map(select(.title == env.TITLE)) | .[0].number // empty")"

          if [ "$live" = "$pinned" ]; then
            echo "Hosted installer matches the pin in $COPY."
            if [ -n "$open_issue" ]; then
              gh issue close "$open_issue" --comment "The hosted installer matches the pin in \`$COPY\` again (sha256 \`$live\`)."
            fi
            exit 0
          fi

          echo "::warning::$HOSTED changed (sha256 $live, pinned $pinned). Update $COPY."
          body="$(printf '%s\n' \
            "$HOSTED now has sha256 \`$live\`. The bundled copy in \`$COPY\` pins \`$pinned\`." \
            "" \
            "Carry the hosted script's changes into \`$COPY\`, keeping the deliberate differences its header lists. Then update the \`hosted-installer-sha256\` pin and run \`node scripts/sync-adapters.mjs\`." \
            "" \
            "Found by run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID.")"
          if [ -n "$open_issue" ]; then
            # Comment only when the hosted script has changed again, so a
            # drift left open for days doesn't get a comment every day.
            if gh issue view "$open_issue" --json body,comments --jq '.body, .comments[].body' | grep -qF "$live"; then
              echo "Issue #$open_issue already reports sha256 $live."
            else
              gh issue comment "$open_issue" --body "$body"
            fi
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
